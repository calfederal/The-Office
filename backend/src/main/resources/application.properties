spring.application.name=BankingPlatform

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET}
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:admin@cafed.bank}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
bank.name=${BANK_NAME:CAFED Bank}
